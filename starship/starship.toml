# Used by Agnoster only for contextual runtime modules.
"$schema" = 'https://starship.rs/config-schema.json'
palette = 'catppuccin_mocha'
add_newline = false
command_timeout = 1000
format = '$nodejs$bun$python$rust$golang$java$php'

[nodejs]
symbol = ' '
style = 'green'
format = '[$symbol($version)]($style) '

[bun]
symbol = ' '
style = 'green'
format = '[$symbol($version)]($style) '

[python]
symbol = ' '
style = 'yellow'
format = '[$symbol$version( $virtualenv)]($style) '

[rust]
symbol = ' '
style = 'peach'
format = '[$symbol($version)]($style) '

[golang]
symbol = ' '
style = 'sky'
format = '[$symbol($version)]($style) '

[java]
symbol = ' '
style = 'red'
format = '[$symbol($version)]($style) '

[php]
symbol = ' '
style = 'lavender'
format = '[$symbol($version)]($style) '

[palettes.catppuccin_mocha]
rosewater = '#f5e0dc'
flamingo = '#f2cdcd'
pink = '#f5c2e7'
mauve = '#cba6f7'
red = '#f38ba8'
maroon = '#eba0ac'
peach = '#fab387'
yellow = '#f9e2af'
green = '#a6e3a1'
teal = '#94e2d5'
sky = '#89dceb'
sapphire = '#74c7ec'
blue = '#89b4fa'
lavender = '#b4befe'
text = '#cdd6f4'
